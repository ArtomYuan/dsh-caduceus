# dsh-caduceus bundle patch (design doc §7).
#
# One package, two self-owned entries. `dsh plugin add` is the only install step.
#
# NOTE (2026-10-31, verified on 0.2.1-rc.2): the base profile ALREADY mounts
# `session-title` plus `session-title-llm` (first-prompt provider). Inserting a
# second provider row here registers the same provider id twice and fails at
# load, so this bundle adds no title row — the surface only calls
# `sessionTitle.rename()` / `.get()`.
- insert:
    - id: caduceus-gateway
      name: 'dsh-caduceus'
      config:
        lang: zh
    - id: caduceus-persona
      name: 'dsh-caduceus/persona'
    # Browser workbench host half: one read-only same-origin route
    # (/caduceus/state). Safe without Feishu credentials — the gateway can sit
    # idle while the workbench still reports sessions, usage and card policy.
    - id: caduceus-workbench
      name: 'dsh-caduceus/workbench'
